name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore persistent debug signing key
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding persistent debug keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Calculate version
        id: versioning
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          TAG_NAME="v${VERSION_NAME}"
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Building Mind Canvas version ${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build APK with Gradle
        run: |
          ./gradlew assembleDebug \
            -PversionCode=${{ steps.versioning.outputs.VERSION_CODE }} \
            -PversionName=${{ steps.versioning.outputs.VERSION_NAME }} \
            --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/MindCanvas-${{ steps.versioning.outputs.TAG_NAME }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/MindCanvas-latest.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.TAG_NAME }}
          name: "Mind Canvas ${{ steps.versioning.outputs.TAG_NAME }}"
          body: |
            ## Mind Canvas Release ${{ steps.versioning.outputs.TAG_NAME }}
            Automated build from commit ${{ github.sha }}
            
            - Version Code: `${{ steps.versioning.outputs.VERSION_CODE }}`
            - Version Name: `${{ steps.versioning.outputs.VERSION_NAME }}`
            
            ### Downloads
            - [MindCanvas-${{ steps.versioning.outputs.TAG_NAME }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.versioning.outputs.TAG_NAME }}/MindCanvas-${{ steps.versioning.outputs.TAG_NAME }}.apk)
          files: |
            release-artifacts/MindCanvas-${{ steps.versioning.outputs.TAG_NAME }}.apk
            release-artifacts/MindCanvas-latest.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
